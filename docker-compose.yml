services:
  # Backend - Spring Boot
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: planning-poker-backend
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${PG_DATABASE:-planningpoker}
      - SPRING_DATASOURCE_USERNAME=${PG_USER:-planningpoker}
      - SPRING_DATASOURCE_PASSWORD=${PG_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-86400000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - JAVA_HOME=/opt/java/openjdk
    volumes:
      - ./backend:/app
      - maven-cache:/root/.m2
      # Excluir target do volume para evitar conflitos de versão Java
      # Usar volume anônimo para sobrescrever apenas o diretório target
      - /app/target
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - planning-poker-network
    command: mvn spring-boot:run -Dspring-boot.run.jvmArguments="-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"

  # Frontend - Angular
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: planning-poker-frontend
    ports:
      - "4200:4200"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NG_APP_API_URL=${NG_APP_API_URL:-http://localhost:8080/api}
      - NG_APP_GOOGLE_CLIENT_ID=${NG_APP_GOOGLE_CLIENT_ID:-}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - planning-poker-network
    command: npm run start -- --host 0.0.0.0 --poll 2000

  # PostgreSQL Database
  postgres:
    image: postgres:9.5
    container_name: planning-poker-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${PG_DATABASE:-planningpoker}
      - POSTGRES_USER=${PG_USER:-planningpoker}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER:-planningpoker}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - planning-poker-network

  # pgAdmin (opcional - use: docker-compose --profile tools up)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: planning-poker-pgadmin
    ports:
      - "8081:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@planningpoker.local
      - PGADMIN_DEFAULT_PASSWORD=${PG_PASSWORD:-admin123}
    depends_on:
      - postgres
    networks:
      - planning-poker-network
    profiles:
      - tools

volumes:
  postgres-data:
  maven-cache:
  frontend-node-modules:


networks:
  planning-poker-network:
    driver: bridge
