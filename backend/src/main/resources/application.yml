spring:
  application:
    name: planning-poker-api

  # Lazy Initialization - Inicializa beans só quando necessário (startup mais rápido)
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:false}

  # Virtual Threads (Java 21+)
  threads:
    virtual:
      enabled: true

  # PostgreSQL Database (UOL Host)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql.uhserver.com:5432/star_wars_app}
    username: ${SPRING_DATASOURCE_USERNAME:wmakeouthill}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA - ddl-auto desabilitado pois usamos Liquibase
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Usar nomes físicos exatos (sem conversão para minúsculas)
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  # Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  # Security - OAuth2
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile

# Server
server:
  port: 8080

# MVC - Usar AntPathMatcher para compatibilidade com padrões /*.js
spring.mvc:
  pathmatch:
    matching-strategy: ant_path_matcher

# API Path
api:
  path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# OpenAPI - Desabilitado em produção para startup mais rápido
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${ENABLE_API_DOCS:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${ENABLE_SWAGGER:true}

# Logging - Níveis ajustados via variável de ambiente (prod usa WARN/INFO)
logging:
  level:
    com.planningpoker: ${LOG_LEVEL_APP:DEBUG}
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    liquibase: ${LOG_LEVEL_LIQUIBASE:INFO}
