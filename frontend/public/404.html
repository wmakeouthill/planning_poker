<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Planning Poker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // GitHub Pages SPA redirect
    // Converte o path em query parameter para o index.html processar
    var basePath = '/planning_poker';
    var pathSegmentsToKeep = 1; // Quantos segmentos do path manter (1 = /planning_poker)
    
    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
    var search = l.search;
    var hash = l.hash;
    
    // Redireciona para index.html com a rota no query string
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      basePath + '/?/' + path +
      (search ? '&' + search.slice(1) : '') +
      hash
    );
  </script>
</head>
<body>
  <p>Redirecionando...</p>
  <noscript>
    <p>Por favor, habilite JavaScript para acessar esta aplicação.</p>
  </noscript>
</body>
</html>
