<div class="emoji-carousel">
    <!-- Dropdown de categorias -->
    <div class="category-dropdown">
        <button class="category-btn" (click)="toggleDropdown()">
            📂
        </button>

        @if (showDropdown()) {
        <div class="dropdown-content" (mouseleave)="closeDropdown()">
            @for (category of categories; track category.name) {
            <div class="category-section">
                <span class="category-name">{{ category.name }}</span>
                <div class="category-emojis">
                    @for (emoji of category.emojis; track emoji) {
                    <button class="emoji-btn" [class.selected]="emoji === selectedEmoji" (click)="selectEmoji(emoji)">
                        {{ emoji }}
                    </button>
                    }
                </div>
            </div>
            }
        </div>
        }
    </div>

    <span class="carousel-label">Arremessar:</span>

    <!-- Todos os emojis roláveis -->
    <div class="emoji-list" #emojiList>
        @for (emoji of allEmojis; track emoji) {
        <button class="emoji-btn" [class.selected]="emoji === selectedEmoji" (click)="selectEmoji(emoji)">
            {{ emoji }}
        </button>
        }
    </div>
</div>
