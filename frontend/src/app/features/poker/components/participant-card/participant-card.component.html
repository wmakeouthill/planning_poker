<div class="participant-card" [style.top]="top" [style.left]="left" [class.voted]="vote.hasVoted"
    [class.revealed]="vote.revealed" [class.name-top]="namePosition === 'top'" [class.name-bottom]="namePosition === 'bottom'">
    @if (namePosition === 'top') {
    <span class="participant-name" [title]="vote.participantName">{{ vote.participantName }}</span>
    }
    <div class="card-flip-container" (click)="onCardClick($event)">
        <div class="card-flip-inner" [class.flipped]="vote.revealed">
            <!-- Card Back (Face Down) - Sempre visível durante votação -->
            <div class="card-face card-back">
                <div class="card-back-pattern">
                    <div class="pattern-top"></div>
                    <div class="pattern-center">
                        @if (vote.hasVoted && !vote.revealed) {
                        <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2.5">
                            <path d="M5 13l4 4L19 7" />
                        </svg>
                        } @else if (!vote.hasVoted) {
                        <span class="waiting">?</span>
                        }
                    </div>
                    <div class="pattern-bottom"></div>
                </div>
            </div>
            <!-- Card Front (Face Up) - Só aparece quando revelado -->
            <div class="card-face card-front">
                @if (vote.revealed && vote.value) {
                <div class="card-corner card-corner-top-left">
                    <span class="corner-value">{{ vote.value }}</span>
                </div>
                <div class="card-center">
                    <span class="vote-value">{{ vote.value }}</span>
                </div>
                <div class="card-corner card-corner-bottom-right">
                    <span class="corner-value">{{ vote.value }}</span>
                </div>
                }
            </div>
        </div>
    </div>
    @if (namePosition === 'bottom') {
    <span class="participant-name" [title]="vote.participantName">{{ vote.participantName }}</span>
    }
</div>
