<div class="participant-card" 
     [style.top]="top" 
     [style.left]="left"
     [class.voted]="vote.hasVoted" 
     [class.revealed]="vote.revealed">
    <div class="card-flip-container">
        <div class="card-flip-inner" [class.flipped]="vote.revealed || (vote.participantName === participantName && vote.value)">
            <!-- Card Back (Face Down) -->
            <div class="card-face card-back">
                @if (vote.hasVoted) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 13l4 4L19 7" />
                </svg>
                } @else {
                <span class="waiting">?</span>
                }
            </div>
            <!-- Card Front (Face Up) -->
            <div class="card-face card-front">
                <span class="vote-value">{{ vote.value }}</span>
            </div>
        </div>
    </div>
    <span class="participant-name">{{ vote.participantName }}</span>
</div>
