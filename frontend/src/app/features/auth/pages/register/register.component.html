<div class="auth-page">
    <div class="auth-container">
        <!-- Logo -->
        <div class="auth-logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5z" />
                <path d="M2 17l10 5 10-5" />
                <path d="M2 12l10 5 10-5" />
            </svg>
            <h1>Planning Poker</h1>
        </div>

        <!-- Card -->
        <div class="auth-card glass">
            <h2>Criar Conta</h2>
            <p class="auth-subtitle">Preencha os dados para começar</p>

            <!-- Error Message -->
            @if (error()) {
            <div class="error-message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 8v4m0 4h.01" />
                </svg>
                {{ error() }}
            </div>
            }

            <!-- Form -->
            <form (ngSubmit)="register()">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input id="nome" type="text" class="input-glass" placeholder="Seu nome" [value]="nome()"
                        (input)="nome.set($any($event.target).value)" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" class="input-glass" placeholder="seu@email.com" [value]="email()"
                        (input)="email.set($any($event.target).value)" required />
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" class="input-glass" placeholder="Mínimo 6 caracteres"
                        [value]="senha()" (input)="senha.set($any($event.target).value)" required />
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input id="confirmarSenha" type="password" class="input-glass" placeholder="Repita a senha"
                        [value]="confirmarSenha()" (input)="confirmarSenha.set($any($event.target).value)" required />
                </div>

                <button type="submit" class="btn-primary full-width" [disabled]="loading()">
                    @if (loading()) {
                    <span class="spinner"></span>
                    Criando conta...
                    } @else {
                    Criar Conta
                    }
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>ou continue com</span>
            </div>

            <!-- Google Login -->
            <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="loading()">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Continuar com Google
            </button>

            <!-- Login Link -->
            <p class="auth-footer">
                Já tem uma conta?
                <a routerLink="/auth/login">Entrar</a>
            </p>
        </div>
    </div>
</div>
