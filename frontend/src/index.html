<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Planning Poker</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Polyfill for Node.js 'global' variable (required by @stomp/stompjs) -->
  <script>
    if (typeof global === 'undefined') {
      var global = window;
    }
  </script>

  <!-- GitHub Pages SPA redirect handler -->
  <script>
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        history.replaceState(null, null, redirect);
      } else {
        // Handle ?/path format from 404.html
        var l = window.location;
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          var path = decoded.split('?')[0];
          var query = decoded.split('?')[1] || '';
          var newUrl = l.protocol + '//' + l.host + 
            (document.querySelector('base') ? document.querySelector('base').href.replace(l.origin, '').replace(/\/$/, '') : '') +
            '/' + path + (query ? '?' + query : '') + l.hash;
          history.replaceState(null, null, newUrl);
        }
      }
    })();
  </script>

  <!-- Runtime Environment Configuration -->
  <script src="assets/env.js"></script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
