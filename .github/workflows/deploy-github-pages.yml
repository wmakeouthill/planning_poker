name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-github-pages.yml'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend URL (Cloud Run)'
        required: true
        default: 'https://seu-backend.run.app'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Configure backend URL
        working-directory: frontend
        run: |
          BACKEND_URL="${{ github.event.inputs.backend_url || 'https://seu-backend.run.app' }}"
          # Substituir URL do backend no env.js
          sed -i "s|https://SEU-BACKEND\.run\.app|${BACKEND_URL}|g" public/assets/env.js
          # Adicionar variável global se necessário
          if ! grep -q "__BACKEND_URL__" public/assets/env.js; then
            sed -i "s|var backendUrl = window\.__BACKEND_URL__|window.__BACKEND_URL__ = '${BACKEND_URL}';\n    var backendUrl = window.__BACKEND_URL__|g" public/assets/env.js
          fi
      
      - name: Build for GitHub Pages
        working-directory: frontend
        run: npm run build:github-pages
      
      - name: Copy 404.html
        run: cp frontend/public/404.html frontend/dist/frontend/browser/404.html
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
