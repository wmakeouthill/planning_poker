# Cloud Build configuration para Google Cloud Run com Cloud SQL e Secret Manager
steps:
  # Build da imagem Docker usando Dockerfile.cloud-run
  # IMPORTANTE: Variáveis do frontend são passadas via --build-arg
  # Essas variáveis vêm do Secret Manager (GOOGLE_CLIENT_ID)
  # ou de substituições (_GOOGLE_CLIENT_ID e _NG_APP_API_URL)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.cloud-run'
      - '--build-arg'
      - 'GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID'
      - '--build-arg'
      - 'NG_APP_API_URL=$NG_APP_API_URL'
      - '-t'
      - 'gcr.io/$PROJECT_ID/planning-poker:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/planning-poker:latest'
      - '.'
    timeout: '1800s'
    secretEnv: ['GOOGLE_CLIENT_ID', 'NG_APP_API_URL']

  # Push da imagem para Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/planning-poker:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/planning-poker:latest'

  # Deploy no Cloud Run com Cloud SQL
  # NOTA: Substitua CLOUD_SQL_CONNECTION_NAME pela sua instância Cloud SQL
  # Formato: PROJECT_ID:REGION:INSTANCE_NAME
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'planning-poker'
      - '--image'
      - 'gcr.io/$PROJECT_ID/planning-poker:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '10'
      - '--min-instances'
      - '0'
      - '--port'
      - '8080'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION_NAME}'
      - '--set-secrets'
      - 'SPRING_DATASOURCE_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest'
      - '--set-env-vars'
      - 'SPRING_DATASOURCE_URL=jdbc:mysql:///${_DB_NAME}?cloudSqlInstance=${_CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false&serverTimezone=America/Sao_Paulo,SPRING_DATASOURCE_USERNAME=${_DB_USERNAME},JWT_EXPIRATION=86400000,SPRING_PROFILES_ACTIVE=prod,SPRING_JPA_SHOW_SQL=false,GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
    secretEnv: ['SPRING_DATASOURCE_PASSWORD', 'JWT_SECRET', 'GOOGLE_CLIENT_SECRET']

# Secrets do Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/db-password/versions/latest
      env: 'SPRING_DATASOURCE_PASSWORD'
    - versionName: projects/$PROJECT_ID/secrets/jwt-secret/versions/latest
      env: 'JWT_SECRET'
    - versionName: projects/$PROJECT_ID/secrets/google-client-secret/versions/latest
      env: 'GOOGLE_CLIENT_SECRET'
    # Secrets do frontend (usados no BUILD TIME via --build-arg)
    - versionName: projects/$PROJECT_ID/secrets/google-client-id/versions/latest
      env: 'GOOGLE_CLIENT_ID'
    # NG_APP_API_URL será construída dinamicamente após o deploy
    # Por enquanto, usar substituição _NG_APP_API_URL

# Opções
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'

images:
  - 'gcr.io/$PROJECT_ID/planning-poker:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/planning-poker:latest'

# Variáveis de substituição (definir no Cloud Build)
# Exemplo: gcloud builds submit --substitutions=_CLOUD_SQL_CONNECTION_NAME="proj:region:instance",_DB_NAME="planningpoker",_DB_USERNAME="planningpoker_user",_GOOGLE_CLIENT_ID="xxx"
# 
# NOTA: Se você usar Secret Manager, a variável _GOOGLE_CLIENT_ID
# será obtida automaticamente dos secrets. Se não usar, pode passar diretamente aqui.
substitutions:
  _CLOUD_SQL_CONNECTION_NAME: ''  # Formato: PROJECT_ID:REGION:INSTANCE_NAME
  _DB_NAME: 'planningpoker'
  _DB_USERNAME: 'planningpoker_user'
  # Variáveis do frontend (opcional - se não usar Secret Manager)
  _GOOGLE_CLIENT_ID: ''  # Será obtido do Secret Manager se disponível
  _NG_APP_API_URL: ''  # Será construída após o deploy (ex: https://planning-poker-xxx.run.app/api)

