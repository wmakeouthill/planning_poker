# Cloud Build configuration para Google Cloud Run com Cloud SQL
steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.cloud-run'
      - '--build-arg'
      - 'GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'
      - '--build-arg'
      - 'NG_APP_API_URL=${_NG_APP_API_URL}'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/planning-poker/app:$BUILD_ID'
      - '-t'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/planning-poker/app:latest'
      - '.'
    timeout: '1800s'

  # Push para Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/planning-poker/app:$BUILD_ID'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/planning-poker/app:latest'

  # Deploy no Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'planning-poker'
      - '--image'
      - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/planning-poker/app:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'
      - '--max-instances'
      - '2'
      - '--min-instances'
      - '0'
      - '--port'
      - '8080'
      - '--add-cloudsql-instances'
      - '${_CLOUD_SQL_CONNECTION}'
      - '--set-secrets'
      - 'SPRING_DATASOURCE_PASSWORD=db-password:latest,JWT_SECRET=jwt-secret:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest'
      - '--set-env-vars'
      - 'SPRING_DATASOURCE_URL=jdbc:mysql:///${_DB_NAME}?cloudSqlInstance=${_CLOUD_SQL_CONNECTION}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&useSSL=false&serverTimezone=America/Sao_Paulo,SPRING_DATASOURCE_USERNAME=${_DB_USERNAME},JWT_EXPIRATION=86400000,SPRING_PROFILES_ACTIVE=prod,SPRING_JPA_SHOW_SQL=false,GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'

images:
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/planning-poker/app:$BUILD_ID'
  - 'southamerica-east1-docker.pkg.dev/$PROJECT_ID/planning-poker/app:latest'

substitutions:
  _REGION: 'southamerica-east1'
  _CLOUD_SQL_CONNECTION: 'experimenta-ai-soneca-balcao:southamerica-east1:experimenta-ai-balcao'
  _DB_NAME: 'planningpoker'
  _DB_USERNAME: 'planningpoker_user'
  _GOOGLE_CLIENT_ID: '385827294764-ns6i99hvsiu9muvmjrj6rbgjv26sba5g.apps.googleusercontent.com'
  _NG_APP_API_URL: ''
